name=UARDECS_ESP32C3
version=1.0.0
author=Takehiko Hoshi, Hideto Kurosaki and Ken-ichro Yasuba
maintainer=Hoshi@hoshi-lab.net
sentence=A library that provides communication capabilities compliant with the "Ubiquitous Environment Control System (UECS)" standard, which is widely used in protected horticulture in Japan.
paragraph=This library facilitates UECS sweet application development on the ESP32C3 chip board by providing UDP packet broadcast communication via Wi-Fi and internet web server functionality, all compliant with the UECS communication protocol. It supports the ESP32C3-OLED, XIAO ESP32C3, and compatible boards. Please refer to LICENSE.md for licensing information.
category=Communication
